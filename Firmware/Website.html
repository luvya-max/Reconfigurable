                playbackIntervalId = setInterval(executePlaybackCommand, playbackSpeed);
                toggleActiveState(isRobotRunning); // Update button states
            } else {
                commandLogDisplay.textContent += '\nNo more previous recording sessions to play.\n';
                currentPlaybackSessionIndex = -1; // Reset
                toggleActiveState(isRobotRunning);
            }
            removeReplayPrompt();
            commandLogDisplay.scrollTop = commandLogDisplay.scrollHeight;
        });

        replayNoBtn.addEventListener('click', () => {
            commandLogDisplay.textContent += '\nReplay declined.\n';
            currentPlaybackSessionIndex = -1; // Reset
            removeReplayPrompt();
            toggleActiveState(isRobotRunning);
            commandLogDisplay.scrollTop = commandLogDisplay.scrollHeight;
        });

        replayPromptContainer.appendChild(replayYesBtn);
        replayPromptContainer.appendChild(replayNoBtn);
        commandLogDisplay.appendChild(replayPromptContainer);
        commandLogDisplay.scrollTop = commandLogDisplay.scrollHeight;
    }

    /**
     * Removes the replay prompt buttons from the log display.
     */
    function removeReplayPrompt() {
        const promptContainer = document.getElementById('replayPromptContainer');
        if (promptContainer) {
            promptContainer.remove();
        }
    }


    // --- Event Listeners ---

    joy.addEventListener('pointerdown', (e) => {
        if (!isRobotRunning || !isManualMode || isPlaying) return;
        dragging = true;
        joy.setPointerCapture(e.pointerId);
        move(e); // Initial move on pointerdown
    });

    document.addEventListener('pointermove', (e) => {
        if (dragging) {
            move(e); // Continuous move if dragging
        }
        if (draggingLeft) {
            adjustServo(e, 'A');
        }
        if (draggingRight) {
            adjustServo(e, 'B');
        }
    });

    document.addEventListener('pointerup', (e) => {
        if (dragging) {
            dragging = false;
            joy.releasePointerCapture(e.pointerId);

            if (joystickMode === 'spring') {
                resetJoystickAndServos(false); // Do NOT reset servos
            } else if (joystickMode === 'hold') {
                // Do nothing
            } else if (joystickMode === 'snap') {
                let dx = stick.x - center.x;
                let dy = stick.y - center.y;

                const maxRadius = (joy.width / 2) - 25;

                if (Math.hypot(dx, dy) < snapThreshold) {
                    resetJoystickAndServos(false); // Do NOT reset servos
                } else if (Math.abs(dx) < snapThreshold) {
                    stick.x = center.x;
                    motorX = 0;
                    let snappedDy = center.y - stick.y;
                    let normalizedSnappedDy = snappedDy / maxRadius;
                    motorY = Math.round(normalizedSnappedDy * 255);
                } else if (Math.abs(dy) < snapThreshold) {
                    stick.y = center.y;
                    motorY = 0;
                    let snappedDx = stick.x - center.x;
                    let normalizedSnappedDx = snappedDx / maxRadius;
                    motorX = Math.round(normalizedSnappedDx * 255);
                } else {
                    resetJoystickAndServos(false); // Do NOT reset servos
                }
                drawAll();
            }
        }
        if (draggingLeft) {
            draggingLeft = false;
            servoLeftCanvas.classList.remove('dragging');
        }
        if (draggingRight) {
            draggingRight = false;
            servoRightCanvas.classList.remove('dragging');
        }
    });

    servoLeftCanvas.addEventListener('pointerdown', (e) => {
        if (!isRobotRunning || !isManualMode || isPlaying) return;
        draggingLeft = true;
        servoLeftCanvas.setPointerCapture(e.pointerId);
        adjustServo(e, 'A');
    });

    servoRightCanvas.addEventListener('pointerdown', (e) => {
        if (!isRobotRunning || !isManualMode || isPlaying) return;
        draggingRight = true;
        servoRightCanvas.setPointerCapture(e.pointerId);
        adjustServo(e, 'B');
    });

    document.addEventListener('keydown', (e) => {
        if (!isRobotRunning || !isManualMode || isPlaying) return;

        const focusedElement = document.activeElement;
        let step = 5;

        if (focusedElement === joy) {
            move(e); // Trigger move for keyboard events on joystick
        } else if (focusedElement === servoLeftCanvas) {
            if (e.key === 'ArrowUp') {
                servoA = Math.min(180, servoA + step);
            } else if (e.key === 'ArrowDown') {
                servoA = Math.max(0, servoA - step);
            } else {
                return;
            }
            updateAriaValues();
            drawAll();
            if (isRecording) {
                recordCurrentState();
            }
            e.preventDefault();
        } else if (focusedElement === servoRightCanvas) {
            if (e.key === 'ArrowUp') {
                servoB = Math.min(180, servoB + step);
            } else if (e.key === 'ArrowDown') {
                servoB = Math.max(0, servoB - step);
            } else {
                return;
            }
            updateAriaValues();
            drawAll();
            if (isRecording) {
                recordCurrentState();
            }
            e.preventDefault();
        }
    });

    manualModeBtn.addEventListener('click', () => {
        isManualMode = !isManualMode;
        if (isRobotRunning) {
            updateStatusElements();
        }
    });

    joystickModeButtons.forEach(button => {
        button.addEventListener('click', () => {
            if (!isRobotRunning || !isManualMode || isPlaying) return;
            joystickMode = button.id.replace('mode', '').replace('Btn', '').toLowerCase();
            if (joystickMode === 'spring') {
                resetJoystickAndServos(false); // Do NOT reset servos on mode change to spring
            }
            toggleActiveState(isRobotRunning);
        });
    });

    liveClock.addEventListener('click', () => {
        is24HourFormat = !is24HourFormat;
        updateClock();
    });

    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const icon = themeBtn.querySelector('i');
        if (document.body.classList.contains('light-mode')) {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
            themeBtn.setAttribute('aria-label', 'Toggle Dark Theme');
        } else {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
            themeBtn.setAttribute('aria-label', 'Toggle Light Theme');
        }
        drawAll(); // Redraw canvases to update colors
    });

    startStopBtn.addEventListener('click', () => {
        isRobotRunning = !isRobotRunning;
        updateStatusElements();
    });

    recordBtn.addEventListener('click', startRecording); // Now directly calls startRecording to handle toggle logic

    playBtn.addEventListener('click', startPlayback); // Now directly calls startPlayback to handle toggle logic

    clearRecordingsBtn.addEventListener('click', clearRecordedCommands);


    // --- Modal Logic ---
    const robotData = {
        robotStatus: {
            temperature: "25°C",
            humidity: "60%",
            systemStatus: "OK",
            battery: {
                level: "85%",

            },

                { name: "Left Motor", status: "Operational", hours: "500", temp: "30°C" },
                { name: "Right Motor", "status": "Operational", hours: "500", temp: "31°C" },

            ]
        },

                name: "Microcontroller (MCU)",
                status: "Online",
                cpuUsage: "15%",
                memoryUsage: "30%",

            },

                name: "Motor Driver",

                displayDetail: "N20 Motors with a speed of 30 rpm and a DRV8833 motor driver."
            },

            },

            }
        }
    };

    async function displayStatusReport(type) {
        statusModalOverlay.classList.add('visible');
        loadingIndicator.classList.add('visible');
        modalBodyContent.innerHTML = '';

        let title = "";
        let componentData = robotData.componentDetails[type];

        if (!componentData) {
            modalBodyContent.innerHTML = `<p class="status-error">Component data for "${type}" not found. This component might have been removed.</p>`;
            loadingIndicator.classList.remove('visible');
            return;
        }

        // Handle specific display details for certain components, or general report
        if (componentData.hasOwnProperty('displayDetail')) {
            title = `${componentData.name} Details`;
            modalBodyContent.innerHTML = `<p>${componentData.displayDetail}</p>`;
            loadingIndicator.classList.remove('visible');
            modalTitle.textContent = title;
            return; // Exit function after displaying specific detail
        } else {
            // General report generation using LLM for other components/overall status
            title = `${componentData.name} Details`; // Default title for other components
            if (type === 'overall') {
                title = "Overall Robot Status";
            }
            const prompt = `Generate a concise report for the following robot component based on the JSON data. Do NOT include the word "Status" in your generated response. Focus on readability and present key information.
${JSON.stringify(componentData, null, 2)}`;

            modalTitle.textContent = title;

            try {
                let chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });
                const payload = { contents: chatHistory };
                const apiKey = ""
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    let text = result.candidates[0].content.parts[0].text;
                    text = text.replace(/Status: /g, '').replace(/Status /g, ''); // Remove "Status" keyword

                    let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                    // Apply status highlighting
                    formattedText = formattedText.replace(/OK/g, '<span class="status-ok">OK</span>');
                    formattedText = formattedText.replace(/Operational/g, '<span class="status-ok">Operational</span>');
                    formattedText = formattedText.replace(/Running/g, '<span class="status-ok">Running</span>');
                    formattedText = formattedatedText.replace(/Online/g, '<span class="status-ok">Online</span>');
                    formattedText = formattedText.replace(/Active/g, '<span class="status-ok">Active</span>');
                    formattedText = formattedText.replace(/Ready/g, '<span class="status-ok">Ready</span>');
                    formattedText = formattedText.replace(/Stable/g, '<span class="status-ok">Stable</span>');
                    formattedText = formattedText.replace(/Warning/g, '<span class="status-warning">Warning');
                    formattedText = formattedText.replace(/Error/g, '<span class="status-error">Error</span>');
                    formattedText = formattedText.replace(/Critical/g, '<span class="status-error">Critical</span>');

                    modalBodyContent.innerHTML = formattedText;
                } else {
                    modalBodyContent.innerHTML = '<p class="status-error">Failed to generate report. Please try again.</p>';
                    console.error('Gemini API response structure unexpected:', result);
                }
            } catch (error) {
                modalBodyContent.innerHTML = '<p class="status-error">Error fetching report. Please check your network connection or try again later.</p>';
                console.error('Error calling Gemini API:', error);
            } finally {
                loadingIndicator.classList.remove('visible');
            }
        }
    }

    componentButtons.forEach(button => {
        button.addEventListener('click', () => {
            const componentType = button.dataset.component;
            // Map the button data-component to the actual key in robotData.componentDetails
            let actualComponentType = componentType;
            if (componentType === 'motorDriver') { // 'motorDriver' button shows 'motor' data
                actualComponentType = 'motor';
            } else if (componentType === 'boostConverter') {
                actualComponentType = 'boost';
            }
            // All other button types directly match keys in robotData.componentDetails

            if (robotData.componentDetails.hasOwnProperty(actualComponentType)) {
                displayStatusReport(actualComponentType);
            } else {
                statusModalOverlay.classList.add('visible');
                loadingIndicator.classList.remove('visible');
                modalTitle.textContent = "Component Not Found";
                modalBodyContent.innerHTML = `<p class="status-warning">Details for "${componentType}" are not available or the component has been removed from the interface.</p>`;
            }
        });
    });

    modalCloseBtn.addEventListener('click', () => {
        statusModalOverlay.classList.remove('visible');
    });

    statusModalOverlay.addEventListener('click', (e) => {
        if (e.target === statusModalOverlay) {
            statusModalOverlay.classList.remove('visible');
        }
    });

    window.onload = function () {
        updateClock();
        setInterval(updateClock, 1000);
        updateStatusElements();
        initializeParameterDisplays();

        joy.classList.remove('active');
        servoLeftCanvas.classList.remove('active');
        servoRightCanvas.classList.remove('active');
        joy.setAttribute('tabindex', '-1');
        servoLeftCanvas.setAttribute('tabindex', '-1');
        servoRightCanvas.setAttribute('tabindex', '-1');

        modeSpringBtn.classList.add('active-mode');

        drawAll();
    };

    function initializeParameterDisplays() {
        motorXVal.textContent = '0';
        motorYVal.textContent = '0';
        servoAVal.textContent = '90';
        servoBVal.textContent = '90';
    }
